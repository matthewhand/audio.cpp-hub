name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 验证 Go 版本
        run: go version

      - name: 校验依赖完整性
        run: go mod verify

      - name: 获取构建元信息
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          VERSION="$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "构建版本: $VERSION"

      - name: 编译二进制
        run: |
          set -euo pipefail
          # Windows amd64：GUI 子系统，无控制台窗口
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-H windowsgui -s -w -X main.version=$VERSION" \
            -o audio.cpp-hub.exe .
          # 其它平台/架构
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o "$3" .
          }
          build linux amd64 audio.cpp-hub-linux-amd64
          build linux arm64 audio.cpp-hub-linux-arm64
          build darwin arm64 audio.cpp-hub-darwin-arm64
          ls -lh audio.cpp-hub*

      - name: 启动冒烟测试
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          cp audio.cpp-hub-linux-amd64 "$SMOKE_DIR/audio.cpp-hub"
          cp -r web "$SMOKE_DIR/web"
          printf '%s\n' '{"httpPort":18080,"instancePortBase":18090}' > "$SMOKE_DIR/hub.config.json"
          ( cd "$SMOKE_DIR" && exec ./audio.cpp-hub >server.log 2>&1 ) &
          SMOKE_PID=$!
          trap 'kill "$SMOKE_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/models || true)"
            if [ "$CODE" = "200" ]; then
              echo "冒烟测试通过: GET /api/models -> 200"
              exit 0
            fi
            sleep 1
          done
          echo "冒烟测试失败: GET /api/models 未返回 200"
          cat "$SMOKE_DIR/server.log" || true
          exit 1

      - name: 打包
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          make_zip() {
            local root_name="$1"
            local zip_name="$2"
            zip -r -9 -X "dist/$zip_name" "$root_name"
          }
          # Windows amd64
          WIN_ROOT="audio.cpp-hub-${VERSION}-windows-amd64"
          mkdir -p "$WIN_ROOT"
          cp audio.cpp-hub.exe "$WIN_ROOT/"
          cp -r web "$WIN_ROOT/web"
          cp README.md "$WIN_ROOT/"
          make_zip "$WIN_ROOT" "audio.cpp-hub-${VERSION}-windows-amd64.zip"
          # Linux amd64
          LINUX_AMD64_ROOT="audio.cpp-hub-${VERSION}-linux-amd64"
          mkdir -p "$LINUX_AMD64_ROOT"
          cp audio.cpp-hub-linux-amd64 "$LINUX_AMD64_ROOT/audio.cpp-hub"
          cp -r web "$LINUX_AMD64_ROOT/web"
          cp README.md "$LINUX_AMD64_ROOT/"
          chmod +x "$LINUX_AMD64_ROOT/audio.cpp-hub"
          make_zip "$LINUX_AMD64_ROOT" "audio.cpp-hub-${VERSION}-linux-amd64.zip"
          # Linux arm64
          LINUX_ARM64_ROOT="audio.cpp-hub-${VERSION}-linux-arm64"
          mkdir -p "$LINUX_ARM64_ROOT"
          cp audio.cpp-hub-linux-arm64 "$LINUX_ARM64_ROOT/audio.cpp-hub"
          cp -r web "$LINUX_ARM64_ROOT/web"
          cp README.md "$LINUX_ARM64_ROOT/"
          chmod +x "$LINUX_ARM64_ROOT/audio.cpp-hub"
          make_zip "$LINUX_ARM64_ROOT" "audio.cpp-hub-${VERSION}-linux-arm64.zip"
          # macOS arm64
          DARWIN_ARM64_ROOT="audio.cpp-hub-${VERSION}-darwin-arm64"
          mkdir -p "$DARWIN_ARM64_ROOT"
          cp audio.cpp-hub-darwin-arm64 "$DARWIN_ARM64_ROOT/audio.cpp-hub"
          cp -r web "$DARWIN_ARM64_ROOT/web"
          cp README.md "$DARWIN_ARM64_ROOT/"
          chmod +x "$DARWIN_ARM64_ROOT/audio.cpp-hub"
          make_zip "$DARWIN_ARM64_ROOT" "audio.cpp-hub-${VERSION}-darwin-arm64.zip"
          ls -lh dist/

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 生成 Release Notes
        id: release_notes
        run: |
          # 获取最新的 commit 信息
          LATEST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an, %ar)")

          # 获取自上一个 tag 以来的所有 commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_SINCE_TAG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS_SINCE_TAG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          LINUX_ZIPS=$(ls dist/*linux*.zip 2>/dev/null || true)
          WINDOWS_ZIPS=$(ls dist/*windows*.zip 2>/dev/null || true)
          DARWIN_ZIPS=$(ls dist/*darwin*.zip 2>/dev/null || true)
          cat > release_notes.md << 'EOF'
          ## 🚀 Release Notes

           > ⚠️ **重要提示**：更新前请备份 `data/` 目录（上传的音频和音色库）。
           >
           > ⚠️ **IMPORTANT**: Please back up the `data/` directory (uploaded audio and voice library) before upgrading.

           ### 📦 原生单二进制（无需 Java/JRE）
          - 自本版起 hub 改为 Go 原生实现，解压即跑，无需安装任何运行环境
          - 原 Java 版已停止维护，完整备份见本仓库的 `java-main-archive` 分支

          ### 🧩 audio.cpp 说明
          - 发布包不包含 audio.cpp 二进制，请自行从 audio.cpp 项目的 Release 下载后放入 `audiocpp/` 目录（最新版本发布页：https://github.com/0xShug0/audio.cpp/releases/latest），并在 Web UI 中登记可执行文件
          EOF
          echo "" >> release_notes.md
          echo "### 📦 可用版本" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Windows:**" >> release_notes.md
          if [ -n "$WINDOWS_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$WINDOWS_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "**Linux:**" >> release_notes.md
          if [ -n "$LINUX_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$LINUX_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "**macOS:**" >> release_notes.md
          if [ -n "$DARWIN_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$DARWIN_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          cat >> release_notes.md << 'EOF'

          ### 🔐 校验和
          下载后可用 `SHA256SUMS` 校验文件完整性：
          ```bash
          sha256sum -c SHA256SUMS
          ```

          ### 📝 使用方法

          **Windows:**
          ```cmd
          解压 zip，双击 audio.cpp-hub.exe（无控制台窗口，进入系统托盘）
          ```

          **Linux:**
          ```bash
          unzip <你下载的 linux zip 包>
          cd <解压后的目录>
          ./audio.cpp-hub
          ```

          **macOS (Apple Silicon):**
          ```bash
          unzip <你下载的 darwin-arm64 zip 包>
          cd <解压后的目录>
          ./audio.cpp-hub
          ```

          启动后浏览器打开 http://localhost:8080（端口见 hub.config.json 的 httpPort）。

          **注意：**
          - **升级前请先备份 `data/` 目录**。
          - **Back up the `data/` directory before upgrading.**
          - 原生单二进制，无需安装 Java/JRE 等任何运行环境。
          - **安全警告：** 本应用为局域网工具，不具备互联网安全防护能力。请勿将服务端口直接暴露到公网。如需远程访问，请使用反向代理 + HTTPS。

          ---
          ### 📌 最新提交
          EOF

          echo "$LATEST_COMMIT" >> release_notes.md
          echo "" >> release_notes.md

          # 添加提交详情
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            echo "### 📋 自上次发布以来的变更" >> release_notes.md
            echo "" >> release_notes.md
            echo "$COMMITS_SINCE_TAG" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> release_notes.md

          # 输出内容供调试
          echo "生成的 Release Notes:"
          cat release_notes.md

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audio.cpp-hub-${{ steps.get_version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            release_notes.md
          retention-days: 30
