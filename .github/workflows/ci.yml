name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 格式 / 静态检查 / 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 显示 Go 版本
        run: go version

      - name: 校验依赖完整性
        run: go mod verify

      - name: 检查 gofmt 格式
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: go vet
        run: go vet ./...

      - name: go test（含竞态检测）
        run: go test -race ./...

  diagrams:
    name: 图示 / 可访问性契约
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验图示 HTML（role=img / aria / 无远程依赖）
        run: python3 scripts/check-diagrams.py docs/diagrams

  web-toolchain:
    name: 前端 / 类型 · Lint · 格式 · i18n（开发期工具链）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # 本 job 只跑 tsc / ESLint / Prettier / i18n parity，不需要浏览器二进制；
      # @playwright/test 同在 devDependencies 里，它的 postinstall 会拉约 150MB 浏览器，
      # 在这个 job 里纯属浪费，跳过（浏览器由 frontend job 安装，axe 审计复用那一份）。
      - name: 安装工具链依赖（仅 devDependencies，运行期零构建）
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # 硬闸门（ratchet）：tsc --checkJs 与 ESLint 在合并前必须零错误，不使用基线文件豁免。
      # 已知降级集中记录在 web/globals.d.ts / .prettierignore / web/README.md，
      # 均为显式声明而非静默关闭检查。
      - name: 类型检查（tsc --checkJs，noEmit）
        run: npm run check:types

      - name: Lint（ESLint flat config）
        run: npm run lint

      - name: 格式检查（Prettier，范围见 .prettierignore）
        run: npm run format:check

      # 同样是硬闸门（ratchet）：web/i18n.zh.js 与 web/i18n.en.js 的键必须一一对应，
      # 占位符也必须一致。漏翻译的键在页面上表现为裸 key 或 "undefined"，
      # tsc / ESLint / Prettier 三者都看不出来，只有这个脚本能看见。
      - name: i18n 中英键对齐（zh/en parity）
        run: npm run check:i18n

      # 同样只有本脚本能看见的一类回归：web/sw.js 的 PRECACHE_URLS 漏掉首屏资源
      # （index.html 引用 / app.js 的 ES module 传递闭包）。install 走 allSettled，
      # 漏项不会让安装失败，只在离线冷启动时白屏，因此必须有静态闸门。
      - name: Service Worker 预缓存覆盖
        run: npm run check:sw

  frontend:
    name: 前端（单元 / e2e / 清单 / 预算 / 无障碍）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（跳过浏览器下载）
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: 单元测试
        run: npm run test:unit

      - name: UI 清单漂移检查
        run: npm run ui:inventory:check

      - name: 性能预算检查
        run: npm run perf:budget

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # 无障碍审计（axe-core + WCAG 2.0/2.1 A+AA）走真实 headless Chromium。
      # 放在浏览器安装之后：脚本本身不下载浏览器，只用上面已装好的那一份；
      # 若希望复用缓存，设置 PLAYWRIGHT_BROWSERS_PATH 指向已有的 ms-playwright 目录即可。
      # 闸门是棘轮式的：新增规则 / 违规节点数变多才失败（存量欠账登记在
      # scripts/axe-audit.js 的 KNOWN_VIOLATIONS），修好一条即下调基线。
      - name: 无障碍审计（axe-core，WCAG A/AA）
        run: npm run a11y:audit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: e2e（headless，mock 后端）
        run: npm run test:e2e

      - name: 上传 Playwright 报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
