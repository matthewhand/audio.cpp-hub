<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio.cpp-hub — Sequence: /v1 Proxy Routing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Integration · Diagram Design</p>
    <h1>OpenAI-compatible /v1 routing</h1>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seqproxy-title seqproxy-desc">
      <title id="seqproxy-title">Sequence: /v1 proxy routing</title>
      <desc id="seqproxy-desc">An OpenAI client posts to /v1/audio/speech; the hub streams the body to a cache file, scans the top-level model field, routes to a ready instance by service name, forwards and flushes the response, and returns 202 errors for unknown models with no up-front authentication.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- actors -->
      <rect x="40" y="60" width="140" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="60" width="140" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="110" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAI client</text>
      <text x="110" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /v1/*</text>

      <rect x="280" y="60" width="170" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="60" width="170" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="365" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proxy handler</text>
      <text x="365" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">proxy-cache/*.req</text>

      <rect x="560" y="60" width="170" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="60" width="170" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="645" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">InstanceManager</text>
      <text x="645" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FindByName(READY)</text>

      <rect x="820" y="60" width="140" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="820" y="60" width="140" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="890" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Engine</text>
      <text x="890" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">streamed back</text>

      <!-- lifelines -->
      <line x1="110" y1="104" x2="110" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="365" y1="104" x2="365" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="645" y1="104" x2="645" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="890" y1="104" x2="890" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation -->
      <rect x="106" y="140" width="8" height="420" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="361" y="164" width="8" height="340" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="641" y="264" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="886" y="420" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- messages -->
      <path d="M 118,152 H 357" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="160" y="136" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /v1/audio/speech</text>

      <rect x="376" y="176" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">stream body → cache file</text>
      <rect x="376" y="196" width="228" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">scan top-level "model" byte-wise</text>

      <path d="M 369,252 H 637" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="236" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text x="502" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">route by service name</text>

      <path d="M 637,292 H 377" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="432" y="276" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">instance port or error</text>

      <path d="M 369,436 H 882" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="470" y="420" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="570" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">forward cache file as body</text>
      <rect x="470" y="440" width="228" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">flush response chunk-by-chunk</text>

      <path d="M 882,524 H 122" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="360" y="508" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="517" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">status + Content-Type passthrough</text>

      <!-- alt fragment: routing outcomes -->
      <rect x="86" y="544" width="800" height="76" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="86" y="544" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="106" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="98" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[model not found]</text>
      <path d="M 118,592 H 357" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="180" y="576" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="585" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">404 / 409 / 413</text>
      <path d="M 357,608 H 118" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="180" y="600" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250" y="609" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OpenAI-style JSON error</text>

      <!-- legend -->
      <line x1="30" y1="644" x2="970" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="657" x2="152" y2="657" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="160" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">client HTTP</text>
      <line x1="290" y1="657" x2="322" y2="657" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="330" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">internal</text>
      <line x1="440" y1="657" x2="472" y2="657" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="480" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">return</text>
      <line x1="600" y1="657" x2="632" y2="657" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="640" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">headline / error</text>
    </svg>
  </div>
</body>
</html>
