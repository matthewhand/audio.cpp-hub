<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio.cpp-hub — Sequence: TTS End-to-End</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Core operation · Diagram Design</p>
    <h1>TTS end-to-end (async queue → history)</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seqtts-title seqtts-desc">
      <title id="seqtts-title">Sequence: TTS end-to-end</title>
      <desc id="seqtts-desc">The browser POSTs a TTS task, the hub queues it per instance, the serial executor forwards it to the engine, the response JSON is streamed to a temp file, the base64 audio is extracted to the history directory, and the browser polls until the task is done.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- actors -->
      <rect x="40" y="60" width="130" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="60" width="130" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="105" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="105" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">poll 2s</text>

      <rect x="240" y="60" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="60" width="150" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="315" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TaskManager</text>
      <text x="315" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">per-instance queue</text>

      <rect x="460" y="60" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="60" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">audiocpp_server</text>
      <text x="540" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:18xxx</text>

      <rect x="690" y="60" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="690" y="60" width="150" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="765" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HistoryManager</text>
      <text x="765" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">extractAudio</text>

      <rect x="880" y="60" width="90" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="60" width="90" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="925" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">data/</text>
      <text x="925" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">disk</text>

      <!-- lifelines -->
      <line x1="105" y1="104" x2="105" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="315" y1="104" x2="315" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="540" y1="104" x2="540" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="765" y1="104" x2="765" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="925" y1="104" x2="925" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation -->
      <rect x="101" y="140" width="8" height="440" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="311" y="164" width="8" height="380" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="536" y="252" width="8" height="80" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="761" y="364" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="921" y="424" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- messages -->
      <path d="M 113,152 H 307" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="150" y="136" width="122" height="12" rx="2" fill="#f5f5f5"/>
      <text x="211" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/tasks</text>

      <path d="M 307,188 H 121" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="158" y="172" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="214" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">202 queued + id</text>

      <rect x="196" y="212" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="294" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">enqueue · serial per instance</text>

      <path d="M 319,260 H 532" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="356" y="244" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /v1/tasks/run</text>

      <path d="M 532,324 H 328" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="372" y="308" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="432" y="317" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 JSON body</text>

      <rect x="330" y="352" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">stream body → temp file</text>

      <path d="M 319,388 H 757" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="440" y="372" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="538" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">finalizeTTS · RecordTTS</text>

      <path d="M 769,432 H 917" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="790" y="416" width="106" height="12" rx="2" fill="#f5f5f5"/>
      <text x="843" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&lt;taskId&gt;.wav</text>

      <path d="M 319,504 H 117" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="150" y="488" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="218" y="497" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /api/tasks/&lt;id&gt;</text>

      <path d="M 113,536 H 307" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="150" y="520" width="122" height="12" rx="2" fill="#f5f5f5"/>
      <text x="211" y="529" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">status DONE</text>

      <!-- loop fragment -->
      <rect x="80" y="556" width="700" height="48" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="80" y="556" width="46" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="103" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="134" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[while QUEUED/RUNNING · every 2s]</text>
      <path d="M 113,588 H 307" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="150" y="572" width="122" height="12" rx="2" fill="#f5f5f5"/>
      <text x="211" y="581" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">poll task + position</text>

      <path d="M 113,624 H 917" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="440" y="612" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="621" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET .../audio → play wav</text>

      <!-- legend -->
      <line x1="30" y1="652" x2="970" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="665" x2="152" y2="665" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="160" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">call</text>
      <line x1="240" y1="665" x2="272" y2="665" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="280" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">return</text>
      <line x1="400" y1="665" x2="432" y2="665" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="440" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">headline success</text>
      <rect x="600" y="660" width="16" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="622" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">loop fragment</text>
    </svg>
  </div>
</body>
</html>
