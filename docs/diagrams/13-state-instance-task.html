<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio.cpp-hub — Instance & Task State Machines</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · Diagram Design</p>
    <h1>Instance and task lifecycles</h1>

    <svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc">
      <title id="state-title">Instance and task state machines</title>
      <desc id="state-desc">The instance moves from start through STARTING to READY, and to removal on stop, early exit, or health timeout; tasks move from QUEUED to RUNNING to DONE, with FAILED, CANCELLED, and replay-cancellation paths.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- TITLE A -->
      <text x="60" y="76" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">A · Instance lifecycle — instance.go</text>
      <line x1="40" y1="88" x2="960" y2="88" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- start dot -->
      <circle cx="120" cy="180" r="6" fill="#2d3142"/>
      <path d="M 128,180 H 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="152" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/instances</text>

      <!-- STARTING -->
      <rect x="180" y="156" width="140" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="180" y="156" width="140" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="185" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">STARTING</text>
      <text x="250" y="212" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spawn child</text>

      <path d="M 320,180 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="360" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/health 200</text>

      <!-- READY -->
      <rect x="404" y="156" width="140" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="404" y="156" width="140" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="474" y="185" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">READY</text>

      <!-- terminal -->
      <rect x="700" y="156" width="160" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="700" y="156" width="160" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="780" y="185" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">removed</text>
      <circle cx="888" cy="180" r="8" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="888" cy="180" r="5" fill="#4f5d75"/>

      <path d="M 544,180 H 692" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="618" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DELETE / stopAll</text>

      <!-- failure paths -->
      <path d="M 250,204 V 284 H 780 V 212" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="430" y="272" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">exit≠0 early · health timeout 120s</text>

      <path d="M 474,204 V 244 H 300 V 284 H 300 V 284" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="256" y="232" width="150" height="12" rx="2" fill="#f5f5f5"/>
      <text x="331" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Stop before READY</text>
      <path d="M 300,244 V 284 H 776" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>

      <text x="60" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Only STARTING / READY exist in the manager; any exit path deletes the entry and cleans run/&lt;id&gt;.</text>

      <!-- TITLE B -->
      <text x="60" y="368" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">B · Task lifecycle — task.go</text>
      <line x1="40" y1="380" x2="960" y2="380" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- start dot -->
      <circle cx="90" cy="470" r="6" fill="#2d3142"/>
      <path d="M 98,470 H 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="117" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">submit</text>

      <rect x="140" y="446" width="130" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="140" y="446" width="130" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="205" y="475" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QUEUED</text>

      <path d="M 270,470 H 348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="309" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">executor picks</text>

      <rect x="352" y="446" width="130" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="352" y="446" width="130" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="417" y="475" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RUNNING</text>

      <path d="M 482,470 H 560" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="521" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 OK</text>

      <rect x="564" y="446" width="130" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="564" y="446" width="130" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="629" y="475" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DONE</text>
      <circle cx="742" cy="470" r="8" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="742" cy="470" r="5" fill="#4f5d75"/>
      <path d="M 694,470 H 734" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- FAILED -->
      <rect x="564" y="536" width="130" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="564" y="536" width="130" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="629" y="565" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FAILED</text>
      <path d="M 417,494 V 560 H 556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="428" y="518" width="130" height="12" rx="2" fill="#f5f5f5"/>
      <text x="493" y="527" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">engine error / non-200</text>

      <!-- CANCELLED -->
      <rect x="352" y="536" width="130" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="352" y="536" width="130" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="417" y="565" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CANCELLED</text>
      <path d="M 205,494 V 560 H 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="120" y="518" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="190" y="527" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELETE queued · hub restart</text>
      <path d="M 417,494 V 536" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <text x="60" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Replay marks any QUEUED/RUNNING task CANCELLED; finished tasks kept in memory ≤ 100.</text>

      <!-- legend -->
      <line x1="30" y1="636" x2="970" y2="636" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="130" cy="649" r="6" fill="#2d3142"/>
      <text x="146" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">start</text>
      <circle cx="240" cy="649" r="7" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="240" cy="649" r="4" fill="#4f5d75"/>
      <text x="256" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">end</text>
      <rect x="360" y="644" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="382" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">notable terminal</text>
      <line x1="540" y1="649" x2="572" y2="649" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="580" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">success</text>
      <line x1="700" y1="649" x2="732" y2="649" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="740" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">cancel / side path</text>
    </svg>
  </div>
</body>
</html>
