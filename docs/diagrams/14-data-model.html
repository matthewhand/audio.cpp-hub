<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio.cpp-hub — Data Model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / Data Model · Diagram Design</p>
    <h1>On-disk entities and relationships</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">audio.cpp-hub on-disk data model</title>
      <desc id="er-desc">Entities include the executable registry, launch profiles, instances and their server.json, tasks with results, per-model history records with reference snapshots and groups, voices, and download tasks with segmented files, all rooted at the working directory.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ENTITY: Executable -->
      <rect x="40" y="96" width="248" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="96" width="248" height="132" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="96" width="248" height="26" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="40" y1="122" x2="288" y2="122" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="60" y="114" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Executable</text>
      <text x="270" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">executables.json</text>
      <text x="56" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">id  name  path  note</text>
      <text x="56" y="160" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">env { KEY: "${VAR}" }</text>
      <text x="56" y="178" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">createdAt</text>
      <text x="56" y="204" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">registry.go · global</text>

      <!-- ENTITY: Profile -->
      <rect x="40" y="264" width="248" height="116" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="264" width="248" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="264" width="248" height="26" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="40" y1="290" x2="288" y2="290" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="60" y="282" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Profile</text>
      <text x="270" y="282" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">data/profiles.json</text>
      <text x="56" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">id  name  modelId</text>
      <text x="56" y="328" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">weightsPath  backend</text>
      <text x="56" y="346" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">device  threads  execId?</text>
      <text x="56" y="368" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">registry.go</text>

      <!-- ENTITY: Instance -->
      <rect x="376" y="96" width="248" height="164" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="96" width="248" height="164" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="376" y="96" width="248" height="26" rx="6" fill="rgba(235,108,54,0.10)"/>
      <line x1="376" y1="122" x2="624" y2="122" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <text x="396" y="114" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Instance</text>
      <text x="606" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">in-memory + run/&lt;id&gt;/</text>
      <text x="392" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">id  name (instanceName)  modelId</text>
      <text x="392" y="160" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">weightsPath  port  backend  device</text>
      <text x="392" y="178" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">execName  threads  sessionOptions</text>
      <text x="392" y="196" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">status ∈ STARTING|READY</text>
      <text x="392" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">createdAt  taskCount</text>
      <text x="392" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">instance.go · server.json + server.log</text>

      <!-- ENTITY: Task -->
      <rect x="376" y="292" width="248" height="180" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="292" width="248" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="376" y="292" width="248" height="26" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="376" y1="318" x2="624" y2="318" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="396" y="310" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Task</text>
      <text x="606" y="310" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">data/tasks/&lt;id&gt;.task.json</text>
      <text x="392" y="338" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">id  instanceId  instanceName</text>
      <text x="392" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">modelId  category</text>
      <text x="392" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">status ∈ QUEUED|RUNNING|DONE</text>
      <text x="392" y="392" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">|FAILED|CANCELLED</text>
      <text x="392" y="410" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">createdAt  startedAt  finishedAt</text>
      <text x="392" y="428" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">error  text  result</text>
      <text x="392" y="454" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">task.go (+ &lt;id&gt;.result.json)</text>

      <!-- ENTITY: History record -->
      <rect x="712" y="96" width="248" height="180" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="96" width="248" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="96" width="248" height="26" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="712" y1="122" x2="960" y2="122" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="732" y="114" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">History record</text>
      <text x="942" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">data/history/&lt;modelId&gt;/</text>
      <text x="728" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">taskId  time  instanceName</text>
      <text x="728" y="160" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">category  ok  voice  text</text>
      <text x="728" y="178" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">language  options  result  error</text>
      <text x="728" y="196" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">refs  refBytes  groupId?</text>
      <text x="728" y="222" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">history.go · index.jsonl (append-only)</text>
      <text x="728" y="242" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">&lt;taskId&gt;.wav + .ref/.emo/.spkN.wav</text>
      <text x="728" y="262" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">groups.json · no auto-eviction</text>

      <!-- ENTITY: Voice -->
      <rect x="712" y="308" width="248" height="116" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="308" width="248" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="308" width="248" height="26" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="712" y1="334" x2="960" y2="334" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="732" y="326" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Voice</text>
      <text x="942" y="326" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">data/voices/</text>
      <text x="728" y="354" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">vid  name (unique)  text?</text>
      <text x="728" y="372" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">createdAt  durationSec</text>
      <text x="728" y="390" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">sampleRate  channels  sizeBytes</text>
      <text x="728" y="414" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">voices.go · index.json + &lt;vid&gt;.wav</text>

      <!-- ENTITY: Download task -->
      <rect x="712" y="452" width="248" height="164" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="452" width="248" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="452" width="248" height="26" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="712" y1="478" x2="960" y2="478" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="732" y="470" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Download task</text>
      <text x="942" y="470" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">data/downloads/&lt;id&gt;/</text>
      <text x="728" y="498" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">id  targetDir  modelId?  packageId?</text>
      <text x="728" y="516" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">source ∈ hf|modelscope</text>
      <text x="728" y="534" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">status  error  token (plaintext)</text>
      <text x="728" y="552" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">createdAt  updatedAt</text>
      <text x="728" y="570" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">files[] → segments[] → done  /  .part</text>
      <text x="728" y="596" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">download.go · task.json + models/&lt;dir&gt;/</text>

      <!-- RELATIONS -->
      <path d="M 288,160 H 330 V 150 H 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="304" y="132" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="334" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">launches</text>

      <path d="M 288,322 H 330 V 190 H 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="300" y="248" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="331" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">applied to</text>

      <path d="M 500,260 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="416" y="264" width="90" height="12" rx="2" fill="#f5f5f5"/>
      <text x="461" y="273" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">runs 0..N tasks</text>

      <path d="M 624,380 H 708" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="632" y="364" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TTS records</text>

      <path d="M 748,288 V 304" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="770" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">copied as ref snapshot</text>

      <path d="M 624,428 H 660 V 520 H 708" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="628" y="466" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="475" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fulfils model</text>

      <!-- legend -->
      <line x1="30" y1="644" x2="970" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="652" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="142" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">entity (file-backed)</text>
      <rect x="290" y="652" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="312" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">runtime (in-memory)</text>
      <line x1="480" y1="657" x2="512" y2="657" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="520" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">reference</text>
      <line x1="630" y1="657" x2="662" y2="657" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="670" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">primary output link</text>
      <line x1="800" y1="657" x2="832" y2="657" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="840" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">indirect / copy</text>
    </svg>
  </div>
</body>
</html>
