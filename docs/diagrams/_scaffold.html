<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── audio.cpp-hub monochrome skin — see style-guide.md ───────────────── */
  :root{
    --paper:#f6f6f7; --paper-2:#ffffff; --ink:#17181c; --muted:#6d6d75; --soft:#9a9aa4;
    --rule:rgba(23,24,28,.12); --rule-solid:#e0e0e4;
    --accent:#17181c; --accent-contrast:#ffffff; --accent-tint:rgba(23,24,28,.06);
    --ok:#059669; --warn:#d97706; --err:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0c0c0e; --paper-2:#141416; --ink:#ededf0; --muted:#8e8e96; --soft:#5f5f68;
      --rule:rgba(255,255,255,.14); --rule-solid:#2a2a2e;
      --accent:#ededf0; --accent-contrast:#111114; --accent-tint:rgba(237,237,240,.10);
      --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
  .page{max-width:1240px;margin:0 auto;padding:40px 24px 56px}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--soft);margin:0 0 8px}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;line-height:1.2;margin:0 0 8px}
  .subtitle{color:var(--muted);font-size:14px;margin:0 0 28px;max-width:70ch}
  .diagram{background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;
    padding:20px;overflow-x:auto;margin:0}
  svg{display:block;width:100%;height:auto}
  .cards{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:16px;margin:28px 0 0}
  .card{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;padding:20px}
  .card h3{margin:8px 0 8px;font-size:15px}
  .card p,.card li{color:var(--muted);font-size:13px;margin:0}
  .card ul{margin:8px 0 0;padding-left:18px}
  .card .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:8px}
  .dot.ink{background:var(--ink)} .dot.muted{background:var(--muted)} .dot.soft{background:var(--soft)}
  .colophon{font-family:'Geist Mono',monospace;font-size:11px;color:var(--soft);
    border-top:1px solid var(--rule);margin-top:32px;padding-top:12px}
  /* ── SVG semantic classes ─────────────────────────────────────────────── */
  .bg{fill:var(--paper)}
  .mask{fill:var(--paper)}
  .zone{fill:var(--ink);fill-opacity:.02;stroke:var(--rule);stroke-width:.8}
  .zone-mask{fill:var(--paper)}
  .n{fill:var(--paper-2);stroke:var(--ink);stroke-width:1}
  .n.focal{fill:var(--accent);stroke:var(--accent)}
  .n.store{fill:var(--ink);fill-opacity:.05;stroke:var(--muted)}
  .n.ext{fill:var(--ink);fill-opacity:.03;stroke:var(--ink);stroke-opacity:.30}
  .n.input{fill:var(--muted);fill-opacity:.10;stroke:var(--soft)}
  .n.async{fill:var(--ink);fill-opacity:.02;stroke:var(--ink);stroke-opacity:.20;stroke-dasharray:4,3}
  .tag{fill:none;stroke:var(--rule-solid);stroke-width:.8}
  .eyebrow-svg{fill:var(--soft);font-family:'Geist Mono',monospace;font-size:7px;
    letter-spacing:.14em;text-transform:uppercase}
  .name{fill:var(--ink);font-family:'Geist','Noto Sans SC',sans-serif;font-size:12px;font-weight:600}
  .sub{fill:var(--muted);font-family:'Geist Mono',monospace;font-size:9px}
  .focal .name{fill:var(--accent-contrast)}
  .focal .sub{fill:var(--accent-contrast);opacity:.8}
  .alabel{fill:var(--muted);font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:.06em}
  .data{stroke:var(--muted);stroke-width:1.2;fill:none}
  .data.dash{stroke-dasharray:5,4;stroke-width:1}
  .data.accent{stroke:var(--accent)}
  .divider{stroke:var(--rule-solid);stroke-width:1}
  .lifeline{stroke:var(--ink);stroke-opacity:.20;stroke-width:1;stroke-dasharray:3,3}
  .act{fill:var(--ink);fill-opacity:.06;stroke:var(--muted);stroke-width:.8}
  .frame{fill:var(--ink);fill-opacity:.02;stroke:var(--rule);stroke-width:1}
  .mk{fill:var(--muted)} .mk-a{fill:var(--accent)}
  .mk-open{fill:none;stroke:var(--muted);stroke-width:1.2}
</style>
</head>
<body>
<main class="page">
  <header>
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__H1__</h1>
    <p class="subtitle">__SUBTITLE__</p>
  </header>

  <figure class="diagram">
    <!-- a11y: <title> is the FIRST child of <svg>; IDs are prefixed with the file slug -->
    <svg role="img" aria-labelledby="__SLUG__-title __SLUG__-desc" viewBox="0 0 1160 820">
      <title id="__SLUG__-title">__TITLE__</title>
      <desc id="__SLUG__-desc">__DESC__</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon class="mk-a" points="0 0, 8 3, 0 6"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline class="mk-open" points="0 0, 8 3, 0 6"/></marker>
      </defs>

      <rect class="bg" width="1160" height="820"/>

      <!-- zones first (bg → zones → arrows → labels → nodes) -->
      <rect class="zone" x="40" y="56" width="280" height="240" rx="8"/>
      <rect class="zone-mask" x="52" y="48" width="72" height="12" rx="2"/>
      <text class="eyebrow-svg" x="88" y="57" text-anchor="middle">CLIENTS</text>

      <!-- arrows before boxes -->
      <path class="data" d="M 320,176 H 392 Q 400,176 400,168 V 168" marker-end="url(#arrow)"/>
      <rect class="mask" x="330" y="156" width="52" height="12" rx="2"/>
      <text class="alabel" x="356" y="165" text-anchor="middle">HTTP :18080</text>

      <!-- nodes: mask → styled rect → type tag → name → sublabel -->
      <rect class="mask" x="72" y="120" width="216" height="112" rx="6"/>
      <rect class="n input" x="72" y="120" width="216" height="112" rx="6"/>
      <rect class="tag" x="80" y="126" width="40" height="12" rx="2"/>
      <text class="eyebrow-svg" x="100" y="135" text-anchor="middle">BROWSER</text>
      <text class="name" x="180" y="184" text-anchor="middle">Web UI / API 客户端</text>
      <text class="sub" x="180" y="202" text-anchor="middle">web/ · fetch /api/*</text>

      <rect class="mask" x="400" y="120" width="320" height="112" rx="6"/>
      <rect class="n focal" x="400" y="120" width="320" height="112" rx="6"/>
      <rect class="tag" x="408" y="126" width="48" height="12" rx="2"/>
      <text class="eyebrow-svg" x="432" y="135" text-anchor="middle">HUB</text>
      <text class="name" x="560" y="184" text-anchor="middle">audio.cpp-hub</text>
      <text class="sub" x="560" y="202" text-anchor="middle">single Go binary · :18080</text>

      <!-- legend strip -->
      <line class="divider" x1="40" y1="760" x2="1120" y2="760"/>
      <text class="eyebrow-svg" x="40" y="780">LEGEND</text>
      <rect class="n focal" x="360" y="770" width="16" height="12" rx="2"/>
      <text class="sub" x="384" y="780">focal</text>
      <rect class="n" x="520" y="770" width="16" height="12" rx="2"/>
      <text class="sub" x="544" y="780">component</text>
      <rect class="n ext" x="700" y="770" width="16" height="12" rx="2"/>
      <text class="sub" x="724" y="780">external</text>
      <path class="data dash" d="M 880,776 H 912" marker-end="url(#arrow)"/>
      <text class="sub" x="920" y="780">async / network</text>
    </svg>
  </figure>

  <section class="cards">
    <div class="card">
      <p class="eyebrow">KEY POINT</p>
      <h3><span class="dot ink"></span>Hub 不加载模型</h3>
      <p>hub 进程只做编排，模型始终在独立的 audiocpp_server 子进程中运行。</p>
    </div>
    <div class="card">
      <p class="eyebrow">BOUNDARY</p>
      <h3><span class="dot muted"></span>仅本机 / 局域网</h3>
      <p>无鉴权设计；子进程绑定 127.0.0.1。</p>
    </div>
    <div class="card">
      <p class="eyebrow">SOURCE</p>
      <h3><span class="dot soft"></span>依据</h3>
      <ul><li>main.go / api.go</li><li>instance.go</li><li>README.md</li></ul>
    </div>
  </section>

  <footer class="colophon">audio.cpp-hub · diagram-design monochrome skin · edit the SVG above, keep 4px grid</footer>
</main>
</body>
</html>
