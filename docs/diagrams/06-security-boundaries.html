<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio.cpp-hub — Security & Trust Boundaries</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Security · Trust Boundaries · Diagram Design</p>
    <h1>Trust zones and privileged operations</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec-title sec-desc">
      <title id="sec-title">audio.cpp-hub security and trust boundaries</title>
      <desc id="sec-desc">Layers from network clients through an optional reverse proxy to the unauthenticated hub, then to loopback engine processes and the host filesystem; privileged operations include arbitrary executable registration, filesystem mkdir, and plaintext Hugging Face tokens.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LAYERS (top to bottom), each a wide band -->
      <!-- layer 1: untrusted -->
      <rect x="40" y="60" width="920" height="72" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="52" y="66" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="75" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UNTRUSTED NETWORK</text>
      <rect x="76" y="90" width="200" height="34" rx="6" fill="#f5f5f5"/>
      <rect x="76" y="90" width="200" height="34" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="176" y="111" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any client on the LAN</text>
      <rect x="320" y="90" width="240" height="34" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="90" width="240" height="34" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="440" y="111" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public internet (do not expose)</text>
      <text x="600" y="111" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace">no authn · no TLS by default</text>

      <!-- layer 2: optional proxy boundary -->
      <rect x="40" y="152" width="920" height="72" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="52" y="158" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="136" y="167" fill="rgba(235,108,54,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RECOMMENDED BOUNDARY</text>
      <rect x="76" y="182" width="260" height="34" rx="6" fill="#f5f5f5"/>
      <rect x="76" y="182" width="260" height="34" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="206" y="203" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reverse proxy + TLS + authn</text>
      <text x="380" y="203" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">mTLS / Basic / OAuth · not built in</text>

      <!-- layer 3: hub -->
      <rect x="40" y="244" width="920" height="176" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="52" y="250" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="122" y="259" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HUB — NO AUTHN</text>
      <rect x="76" y="272" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="76" y="272" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="166" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CSRF guard only</text>
      <text x="166" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Origin / Sec-Fetch-Site</text>

      <rect x="276" y="272" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="276" y="272" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Binds :8080 all IFs</text>
      <text x="376" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">instances bind 127.0.0.1</text>

      <rect x="496" y="272" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="272" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caps enforced</text>
      <text x="596" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">64 MB body · path checks</text>

      <rect x="716" y="272" width="212" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="716" y="272" width="212" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="822" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SSRF allow-list</text>
      <text x="822" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">blocks private / metadata IPs</text>

      <!-- privileged ops row -->
      <rect x="76" y="344" width="270" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="76" y="344" width="270" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1"/>
      <text x="211" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Arbitrary executable paths</text>
      <text x="211" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/api/executables* + start</text>
      <text x="211" y="396" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">⇒ code exec as hub user</text>

      <rect x="366" y="344" width="200" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="366" y="344" width="200" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1"/>
      <text x="466" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local FS browse + mkdir</text>
      <text x="466" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/api/fs/* (by design)</text>
      <text x="466" y="396" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">write anywhere writable</text>

      <rect x="586" y="344" width="342" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="586" y="344" width="342" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1"/>
      <text x="757" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Secrets at rest</text>
      <text x="757" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HF token plaintext in data/downloads/&lt;id&gt;/task.json</text>
      <text x="757" y="396" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stripped from API output only</text>

      <!-- layer 4: local trust -->
      <rect x="40" y="444" width="920" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="52" y="450" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="136" y="459" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL TRUST (LOOPBACK)</text>
      <rect x="76" y="472" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="76" y="472" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="176" y="498" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">audiocpp_server</text>
      <text x="176" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:18090+</text>
      <text x="176" y="530" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">child process</text>

      <rect x="296" y="472" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="472" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="396" y="498" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">data/ · models/ · run/</text>
      <text x="396" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">user audio · weights</text>
      <text x="396" y="530" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">backup with care</text>

      <rect x="516" y="472" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="516" y="472" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="616" y="498" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host writable dirs</text>
      <text x="616" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mk / download targets</text>
      <text x="616" y="530" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">least-privilege user</text>

      <rect x="736" y="472" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="472" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="832" y="498" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HF / ModelScope</text>
      <text x="832" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">egress only</text>
      <text x="832" y="530" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">allow-listed hosts</text>

      <!-- arrows showing crossing boundaries -->
      <path d="M 176,124 V 172" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 206,216 V 262" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 166,328 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 596,328 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 176,556 V 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- annotation -->
      <rect x="40" y="600" width="920" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="600" width="920" height="44" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="60" y="627" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Source of truth: SECURITY.md — “no authn, no TLS, no CSRF-origin bypass for same-origin curl”. Only exposed boundary is the loopback engine link and the CSRF same-origin check.</text>

      <!-- legend -->
      <line x1="30" y1="660" x2="970" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="668" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="142" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">defense present</text>
      <rect x="260" y="668" width="16" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1"/>
      <text x="282" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">privileged / risk surface</text>
      <line x1="450" y1="673" x2="482" y2="673" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="490" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">required boundary crossing</text>
      <line x1="670" y1="673" x2="702" y2="673" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="710" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">capability</text>
    </svg>
  </div>
</body>
</html>
