<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio.cpp-hub — Sequence: Weight Download</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Async processing · Diagram Design</p>
    <h1>Weight download: probe → segments → resume</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seqdl-title seqdl-desc">
      <title id="seqdl-title">Sequence: weight download with resume</title>
      <desc id="seqdl-desc">The manager probes HEAD for size and Range support with an SSRF check, splits the file into segments written via WriteAt to a .part file, retries failed segments with backoff, and on restart reconciles segment progress from the .part file size before renaming to the final weights path.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- actors -->
      <rect x="40" y="60" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="60" width="150" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="115" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
      <text x="115" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/downloads</text>

      <rect x="270" y="60" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="270" y="60" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="350" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DownloadManager</text>
      <text x="350" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">probe · segments</text>

      <rect x="500" y="60" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="60" width="160" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="580" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Remote (HF/MS)</text>
      <text x="580" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTPS · Range</text>

      <rect x="730" y="60" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="730" y="60" width="150" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="805" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">models/ disk</text>
      <text x="805" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.part → rename</text>

      <!-- lifelines -->
      <line x1="115" y1="104" x2="115" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="350" y1="104" x2="350" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="580" y1="104" x2="580" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="805" y1="104" x2="805" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation -->
      <rect x="111" y="140" width="8" height="420" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="346" y="164" width="8" height="360" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="576" y="196" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="801" y="420" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- messages -->
      <path d="M 123,152 H 342" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="160" y="136" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">create download task</text>

      <rect x="360" y="176" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">validate target / SSRF host</text>

      <path d="M 354,204 H 572" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="392" y="188" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="462" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEAD size · Range?</text>

      <path d="M 572,256 H 358" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="392" y="240" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="466" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Content-Length · Accept-Ranges</text>

      <rect x="360" y="284" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="458" y="293" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">build segments · concurrency sem</text>

      <!-- loop fragment: segment retry -->
      <rect x="238" y="316" width="640" height="180" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="238" y="316" width="46" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="261" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="292" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[per segment · retry ≤ N, exponential backoff]</text>

      <path d="M 354,356 H 572" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="392" y="340" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="462" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET Range: bytes=a-b</text>

      <path d="M 572,396 H 358" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="392" y="380" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="466" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">chunk 64 KB</text>

      <path d="M 354,428 H 797" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="456" y="412" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="421" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WriteAt(buf, offset) → .part</text>
      <rect x="456" y="432" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="441" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">persist task.json (throttled)</text>

      <path d="M 350,484 H 123" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="170" y="468" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="477" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">percent · speedBps</text>

      <!-- rename -->
      <path d="M 358,540 H 797" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="470" y="524" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="533" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">all segments done → rename</text>

      <path d="M 115,576 H 797" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="360" y="560" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="569" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">models/&lt;targetDir&gt;/weights</text>

      <!-- restart annotation -->
      <rect x="40" y="592" width="920" height="34" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="60" y="613" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">On restart: reconcile() reads .part size and converges each segment's done offset, then resumes; servers ignoring Range degrade to a whole-file download.</text>

      <!-- legend -->
      <line x1="30" y1="648" x2="970" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="661" x2="152" y2="661" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="160" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">internal</text>
      <line x1="280" y1="661" x2="312" y2="661" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="320" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">remote HTTPS</text>
      <line x1="470" y1="661" x2="502" y2="661" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="510" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">return / progress</text>
      <line x1="700" y1="661" x2="732" y2="661" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="740" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">completion</text>
    </svg>
  </div>
</body>
</html>
