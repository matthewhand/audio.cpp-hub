<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
      <title id="hero-title">audio.cpp-hub hero overview</title>
      <desc id="hero-desc">Operator and OpenAI clients reach the Go hub over HTTP; the hub manages audiocpp_server model subprocesses on loopback, persists state under data/, and fetches model weights from Hugging Face or ModelScope.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <path d="M 372,120 H 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 372,276 H 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 660,196 H 700 V 336 H 740" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 860,336 V 276 H 900" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
      <path d="M 860,416 V 476 H 900" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- users -->
      <rect x="60" y="88" width="312" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="88" width="312" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="68" y="94" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="90" y="103" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="216" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator (Web UI)</text>
      <text x="216" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · :8080</text>

      <rect x="60" y="244" width="312" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="244" width="312" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="68" y="250" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="90" y="259" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="216" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAI clients</text>
      <text x="216" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SDK · /v1/*</text>

      <!-- hub focal -->
      <rect x="420" y="108" width="240" height="240" rx="8" fill="#f5f5f5"/>
      <rect x="420" y="108" width="240" height="240" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="432" y="120" width="34" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="449" y="129" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUB</text>
      <text x="540" y="150" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">audio.cpp-hub</text>
      <text x="540" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Go single binary</text>
      <text x="540" y="196" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">instances · tasks · history</text>
      <text x="540" y="214" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">voices · downloads · proxy</text>
      <text x="540" y="244" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP + static web/</text>
      <text x="540" y="262" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ CSRF same-origin</text>

      <!-- engines -->
      <rect x="740" y="336" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="336" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="748" y="342" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="770" y="351" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
      <text x="840" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">audiocpp_server</text>
      <text x="840" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:18090+</text>
      <text x="840" y="406" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--config server.json</text>

      <!-- external -->
      <rect x="900" y="244" width="60" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="900" y="244" width="60" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="930" y="272" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Voices</text>
      <text x="930" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WAV</text>

      <rect x="900" y="476" width="60" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="900" y="476" width="60" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="930" y="498" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Weights</text>
      <text x="930" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HF / MS</text>
      <text x="930" y="525" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">weights</text>

      <!-- legend -->
      <line x1="30" y1="552" x2="970" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="560" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="142" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal hub</text>
      <rect x="240" y="560" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="262" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">managed process</text>
      <rect x="420" y="560" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="442" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">user / client</text>
      <rect x="570" y="560" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="592" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">external</text>
      <line x1="700" y1="565" x2="732" y2="565" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="740" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">sync</text>
      <line x1="810" y1="565" x2="842" y2="565" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="850" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">read / async</text>
    </svg>
