<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seqapi-title seqapi-desc">
      <title id="seqapi-title">Sequence: normal HTTP API request</title>
      <desc id="seqapi-desc">A browser sends a same-origin mutating request; the hub checks only CSRF same-origin, matches a route, performs id validation, runs the handler, and returns a JSON envelope, with no authentication step because none exists.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- actors -->
      <rect x="60" y="60" width="140" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="60" width="140" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="130" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="130" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">web/app.js</text>

      <rect x="300" y="60" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="60" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CSRF guard</text>
      <text x="380" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">api.go csrProtect</text>

      <rect x="560" y="60" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="60" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ServeMux + handler</text>
      <text x="640" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">49 apiRoutes</text>

      <rect x="800" y="60" width="140" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="60" width="140" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="870" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manager</text>
      <text x="870" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">in-process</text>

      <!-- lifelines -->
      <line x1="130" y1="104" x2="130" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="104" x2="380" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="104" x2="640" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="870" y1="104" x2="870" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation bars -->
      <rect x="126" y="140" width="8" height="380" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="376" y="180" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="636" y="264" width="8" height="180" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="866" y="332" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- messages -->
      <path d="M 138,152 H 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="198" y="134" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="254" y="143" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/instances</text>

      <rect x="386" y="188" width="244" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[same-origin] pass through</text>
      <path d="M 384,212 H 632" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="452" y="240" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">validate ids / paths</text>

      <path d="M 644,288 H 862" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="268" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="770" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mutate registry / start</text>

      <path d="M 862,356 H 648" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="700" y="340" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">result / error</text>

      <!-- alt fragment: cross-site vs same-origin -->
      <rect x="96" y="420" width="800" height="120" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="96" y="420" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="116" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="108" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[Sec-Fetch-Site: cross-site or Origin != Host]</text>
      <path d="M 138,468 H 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="196" y="452" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mutating /api/*</text>
      <path d="M 372,492 H 138" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="188" y="476" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="485" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">403 CROSS_SITE_FORBIDDEN</text>
      <line x1="104" y1="508" x2="888" y2="508" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="108" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[headers absent — curl / server clients]</text>
      <path d="M 138,540 H 372" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="196" y="524" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="533" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">treated same-origin</text>

      <path d="M 648,552 H 142" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="320" y="536" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="545" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">{"ok":true,"data":...}</text>

      <!-- legend -->
      <line x1="30" y1="592" x2="970" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="605" x2="152" y2="605" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="160" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">call</text>
      <line x1="240" y1="605" x2="272" y2="605" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="280" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">return</text>
      <line x1="400" y1="605" x2="432" y2="605" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="440" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">headline / rejection</text>
      <rect x="600" y="600" width="16" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="622" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">alt fragment</text>
    </svg>
