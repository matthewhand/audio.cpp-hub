<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-title ops-desc">
      <title id="ops-title">audio.cpp-hub operations runbook</title>
      <desc id="ops-desc">The hub starts by locating its working directory, loading optional config, binding the port, then recovers tasks and downloads; on shutdown it drains HTTP, stops all instances and pauses downloads. Health is an HTTP healthcheck, and backup is copying data, models and run directories.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- SWIMLANE: phases across columns -->
      <!-- column headers -->
      <text x="200" y="76" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">START</text>
      <text x="420" y="76" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">READY</text>
      <text x="640" y="76" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEGRADED</text>
      <text x="860" y="76" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RECOVER</text>

      <!-- lane labels -->
      <line x1="40" y1="88" x2="960" y2="88" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- lane 1: process -->
      <rect x="40" y="100" width="920" height="140" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="52" y="122" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PROCESS</text>

      <rect x="120" y="140" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="140" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ensureWorkDir</text>
      <text x="200" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">find web/ dir</text>
      <text x="200" y="198" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">load hub.config.json</text>

      <rect x="340" y="140" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="140" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">net.Listen :port</text>
      <text x="420" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fail-fast before tray</text>
      <text x="420" y="198" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cleanup proxy-cache</text>

      <rect x="560" y="140" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="140" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">srv.Serve</text>
      <text x="640" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">serve HTTP + static</text>
      <text x="640" y="198" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tray (Windows) or block</text>

      <rect x="780" y="140" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="780" y="140" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SIGINT/SIGTERM</text>
      <text x="860" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Shutdown 15s drain</text>
      <text x="860" y="198" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stopAll · downloads.Shutdown</text>

      <!-- lane 2: recovery -->
      <rect x="40" y="252" width="920" height="140" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="52" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">STATE RECOVERY</text>

      <rect x="180" y="292" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="292" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tasks.replay()</text>
      <text x="280" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">data/tasks/*.task.json</text>
      <text x="280" y="350" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">active → CANCELLED</text>

      <rect x="400" y="292" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="292" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">downloads.reconcile()</text>
      <text x="500" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.part size → segment done</text>
      <text x="500" y="350" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">auto-resume</text>

      <rect x="620" y="292" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="292" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="720" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">history.replay()</text>
      <text x="720" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">index.jsonl → memory</text>
      <text x="720" y="350" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">groups · voices · profiles</text>

      <!-- lane 3: health -->
      <rect x="40" y="404" width="920" height="120" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="52" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">HEALTH CHECKS</text>

      <rect x="180" y="444" width="260" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="444" width="260" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="468" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GET /v1/models (hub)</text>
      <text x="310" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">docker healthcheck · curl -fsS</text>

      <rect x="480" y="444" width="260" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="444" width="260" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="610" y="468" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GET /health (instance)</text>
      <text x="610" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">polled by hub ≤ 120s after start</text>

      <!-- lane 4: backup -->
      <rect x="40" y="536" width="920" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="52" y="558" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">BACKUP / DIAGNOSIS</text>

      <rect x="180" y="572" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="572" width="260" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="310" y="600" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">backup data/ · models/ · run/</text>

      <rect x="480" y="572" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="572" width="260" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="610" y="592" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">diagnose: logs/hub.log · run/&lt;id&gt;/server.log</text>
      <text x="610" y="608" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/api/events · readLogTail</text>

      <!-- arrows between columns -->
      <path d="M 280,176 H 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 500,176 H 552" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 720,176 H 772" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 860,212 V 272 H 390" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 390,328 H 392" fill="none" stroke="#4f5d75"/>

      <!-- legend -->
      <line x1="30" y1="648" x2="970" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="656" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="142" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">process step</text>
      <rect x="260" y="656" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="282" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">state / store</text>
      <line x1="400" y1="661" x2="432" y2="661" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="440" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">forward</text>
      <line x1="560" y1="661" x2="592" y2="661" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="600" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">shutdown / recovery path</text>
    </svg>
